{% extends "base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h1 class="mb-0">Удаление поста</h1>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить пост "{{ post.title }}"?</p>
                    <p>Это действие нельзя отменить.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                            <a href="{% url 'blog:post_detail' post.id %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
